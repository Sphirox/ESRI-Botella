<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuencas sedimentarias · Colombia</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
  --cream:#f3f0e8;
  --ink:#163a34;
  --muted:#5f6c68;
  --teal:#177e89;
  --line:rgba(22,58,52,.15);
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Inter,"Avenir Next",Avenir,Arial,sans-serif;
  color:var(--ink);
  background:#0d3740;
  overflow:hidden;
}

#map{position:absolute;inset:0}

/* Leyenda flotante compacta */
.legend-panel{
  position:absolute;
  top:18px;
  right:18px;
  z-index:900;
  width:min(285px,calc(100vw - 36px));
  background:rgba(247,244,237,.90);
  backdrop-filter:blur(12px) saturate(115%);
  -webkit-backdrop-filter:blur(12px) saturate(115%);
  border:1px solid rgba(255,255,255,.55);
  border-radius:16px;
  box-shadow:0 14px 38px rgba(10,38,34,.20);
  padding:14px;
}

.legend-panel h1{
  margin:0 0 4px;
  font-size:15px;
  line-height:1.2;
  font-weight:750;
}

.legend-panel .lead{
  margin:0 0 10px;
  font-size:10.5px;
  line-height:1.35;
  color:var(--muted);
}

.legend{
  display:grid;
  gap:4px;
}

.legend-item{
  display:grid;
  grid-template-columns:22px 1fr 12px;
  align-items:center;
  gap:8px;
  padding:6px 7px;
  border-radius:9px;
  cursor:pointer;
  border:1px solid transparent;
  transition:.16s ease;
}

.legend-item:hover,
.legend-item.is-active{
  background:rgba(255,255,255,.82);
  border-color:var(--line);
}

.swatch{
  width:20px;
  height:13px;
  border-radius:4px;
  border:1px solid rgba(22,58,52,.15);
}

.swatch.hatch{
  background:
    repeating-linear-gradient(
      135deg,
      rgba(22,58,52,.32) 0 2px,
      transparent 2px 5px
    ),
    #6d8e3e;
}

.legend-name{
  font-size:10.7px;
  font-weight:650;
  line-height:1.1;
}

.legend-arrow{
  font-size:13px;
  color:#82908c;
  text-align:right;
}

.source{
  margin-top:9px;
  padding-top:8px;
  border-top:1px solid var(--line);
  font-size:8.7px;
  line-height:1.3;
  color:#7b8682;
}

/* Etiqueta flotante VMM */
.vmm-label{
  background:rgba(247,244,237,.95);
  color:#173a34;
  border:1px solid rgba(22,58,52,.12);
  border-radius:10px;
  box-shadow:0 8px 22px rgba(18,47,41,.16);
  padding:7px 9px;
  font-weight:750;
  font-size:11px;
  line-height:1.1;
  white-space:nowrap;
}

.leaflet-tooltip.vmm-tooltip{
  background:transparent;
  border:0;
  box-shadow:none;
  padding:0;
}

.leaflet-tooltip.vmm-tooltip:before{
  display:none;
}

/* Reducir controles para que no compitan con StoryMaps */
.leaflet-control-zoom a{
  width:28px!important;
  height:28px!important;
  line-height:28px!important;
  font-size:16px!important;
}

.leaflet-control-attribution{
  font-size:8px!important;
  background:rgba(255,255,255,.6)!important;
}

@media(max-width:720px){
  .legend-panel{
    top:auto;
    bottom:12px;
    right:12px;
    left:12px;
    width:auto;
    max-height:42vh;
    overflow:auto;
    padding:12px;
  }
  .legend-panel .lead{display:none}
  .legend{
    grid-template-columns:1fr 1fr;
    gap:3px 8px;
  }
  .legend-name{font-size:9.6px}
  .source{display:none}
}
</style>
</head>

<body>
<div id="map"></div>

<aside class="legend-panel">
  <h1>Cuencas sedimentarias con potencial YNC</h1>
  <p class="lead">Selecciona una cuenca para acercarte a ella.</p>
  <div id="legend" class="legend"></div>
  <div class="source">
    Cartografía: Servicio Geológico Colombiano · EPIS. Mapa base: Esri World Imagery.
  </div>
</aside>

<script>
const serviceBase =
  "https://srvags.sgc.gov.co/arcgis/rest/services/EPIS/EPIS_V2/FeatureServer/5";

const basinStyles = [
  {name:"VALLE MEDIO DEL MAGDALENA", color:"#6d8e3e", hatch:true},
  {name:"VALLE SUPERIOR DEL MAGDALENA", color:"#a8c45b"},
  {name:"VALLE INFERIOR DEL MAGDALENA", color:"#e8d893"},
  {name:"LLANOS ORIENTALES", color:"#dca35c"},
  {name:"CAGUAN-PUTUMAYO", color:"#cb7958"},
  {name:"CATATUMBO", color:"#d6b728"},
  {name:"CHOCO", color:"#72b7a8"},
  {name:"GUAJIRA", color:"#8fbaca"},
  {name:"CESAR-RANCHERIA", color:"#72a5bd"}
];

const styleByName = Object.fromEntries(basinStyles.map(x=>[x.name,x]));
const layersByName = {};
let vmmLine = null;
let vmmLabelMarker = null;

const map = L.map("map", {
  zoomControl:true,
  minZoom:4,
  maxZoom:13,
  attributionControl:true
}).setView([4.5,-74.5],5);

// Basemap satelital
L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:19,
    attribution:'Tiles © Esri'
  }
).addTo(map);

// Etiquetas/límites suaves
L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:19,
    opacity:.62,
    attribution:''
  }
).addTo(map);

// Leyenda personalizada
const legend = document.getElementById("legend");
basinStyles.forEach(b=>{
  const item=document.createElement("div");
  item.className="legend-item";
  item.dataset.name=b.name;
  item.innerHTML=`
    <div class="swatch ${b.hatch?"hatch":""}" style="${b.hatch?"":`background:${b.color}`}"></div>
    <div class="legend-name">${b.name.replaceAll("_"," ")}</div>
    <div class="legend-arrow">›</div>
  `;
  item.addEventListener("click",()=>focusBasin(b.name,item));
  legend.appendChild(item);
});

async function loadBasins(){
  const names=basinStyles
    .map(b=>`'${b.name.replaceAll("'","''")}'`)
    .join(",");
  const where=`NOMBRE IN (${names})`;

  const url=new URL(serviceBase+"/query");
  url.searchParams.set("where",where);
  url.searchParams.set("outFields","NOMBRE");
  url.searchParams.set("returnGeometry","true");
  url.searchParams.set("outSR","4326");
  url.searchParams.set("f","geojson");

  const response=await fetch(url.toString());
  if(!response.ok) throw new Error("No fue posible consultar el servicio público del SGC.");

  const geojson=await response.json();

  const allLayer=L.geoJSON(geojson,{
    style:feature=>{
      const name=feature.properties.NOMBRE;
      const s=styleByName[name] || {color:"#94a6a0"};
      return{
        color:"#ffffff",
        weight:name==="VALLE MEDIO DEL MAGDALENA"?2.2:1.05,
        fillColor:s.color,
        fillOpacity:name==="VALLE MEDIO DEL MAGDALENA"?.70:.47
      };
    },
    onEachFeature:(feature,layer)=>{
      const name=feature.properties.NOMBRE;
      layersByName[name]=layer;

      layer.on("click",()=>{
        const item=[...document.querySelectorAll(".legend-item")]
          .find(el=>el.dataset.name===name);
        focusBasin(name,item);
      });
    }
  }).addTo(map);

  // IMPORTANTE: al iniciar se muestran TODAS las cuencas, no zoom al VMM.
  const bounds=allLayer.getBounds();
  if(bounds.isValid()){
    map.fitBounds(bounds.pad(.05),{padding:[18,18],maxZoom:5});
  }

  addVmmCallout();
}

function addVmmCallout(){
  const layer=layersByName["VALLE MEDIO DEL MAGDALENA"];
  if(!layer) return;

  const center=layer.getBounds().getCenter();

  // Punto de etiqueta ligeramente al NE para que no cubra la cuenca.
  const labelLatLng=L.latLng(center.lat+0.75,center.lng+1.0);

  vmmLine=L.polyline(
    [center,labelLatLng],
    {color:"#f7f4ed",weight:2,opacity:.95}
  ).addTo(map);

  L.circleMarker(center,{
    radius:5,
    color:"#f7f4ed",
    weight:2,
    fillColor:"#ffffff",
    fillOpacity:1
  }).addTo(map);

  vmmLabelMarker=L.marker(labelLatLng,{
    interactive:false,
    icon:L.divIcon({
      className:"",
      html:'<div class="vmm-label">Valle Medio<br>del Magdalena</div>',
      iconSize:null,
      iconAnchor:[0,18]
    })
  }).addTo(map);
}

function focusBasin(name,item){
  document.querySelectorAll(".legend-item")
    .forEach(el=>el.classList.remove("is-active"));
  if(item) item.classList.add("is-active");

  const layer=layersByName[name];
  if(!layer) return;

  map.fitBounds(layer.getBounds(),{
    padding:[35,35],
    maxZoom:8,
    animate:true
  });
}

loadBasins().catch(err=>{
  console.error(err);
  document.querySelector(".legend-panel .lead").textContent=
    "No fue posible cargar la cartografía del SGC en este momento.";
});
</script>
</body>
</html>
